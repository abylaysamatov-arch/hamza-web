
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZA WEB</title>

<style>
    
* {
    box-sizing: border-box;
}

body {
    background: #172554;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
}

h1 {
    color: #60A5FA;
    font-size: 45px;
    animation: appear 2s ease;
}

h2 {
    font-size: 25px;
    animation: appear 3s ease;
}

p {
    font-size: 18px;
}

.menu {
    margin-top: 30px;
}

a {
    display: block;
    color: white;
    background: #2563EB;
    padding: 16px;
    margin: 15px auto;
    max-width: 280px;
    border-radius: 10px;
    text-decoration: none;
    transition: transform 0.3s, background 0.3s;
}

a:hover {
    transform: scale(1.1);
    background: #1D4ED8;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

footer {
    margin-top: 50px;
    color: #93C5FD;
}

@media (max-width: 600px) {
    body {
        padding: 20px 12px;
    }

    h1 {
        font-size: 30px;
    }

    h2 {
        font-size: 21px;
    }

    a {
        width: 100%;
    }
}

</style>
</head>

<body>

<h1>HAMZA WEB</h1>

<h2>Добро пожаловать на мой сайт!</h2>

<p>Я изучаю программирование и создаю собственные проекты.</p>

<div class="menu">
    <a href="about.html">Обо мне</a>
    <a href="projects.html">Мои проекты</a>
</div>

<footer>
    Мой первый профессиональный сайт
</footer>

</body>
</html>
