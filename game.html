
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZA GAME</title>

<style>
body {
    background: #172554;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 30px;
}

h1 {
    color: #60a5fa;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 15px 22px;
    margin: 8px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#score {
    font-size: 40px;
    font-weight: bold;
}

.shop {
    background: #1e3a8a;
    padding: 20px;
    border-radius: 15px;
    margin: 20px auto;
    max-width: 400px;
}
</style>
</head>

<body>

<h1>HAMZA CLICK GAME</h1>

<h2>Выбери уровень</h2>

<button onclick="startGame(30)">Лёгкий</button>
<button onclick="startGame(20)">Средний</button>
<button onclick="startGame(10)">Сложный</button>

<h2 id="timer">Время: 0</h2>

<p>Твои очки:</p>
<div id="score">0</div>

<button onclick="addPoint()">НАЖМИ МЕНЯ!</button>

<div class="shop">
    <h2>🛒 МАГАЗИН</h2>

    <p>Сила клика: <span id="power">1</span></p>
    <p>Цена улучшения: 20 очков</p>

    <button onclick="buyUpgrade()">
        КУПИТЬ УЛУЧШЕНИЕ
    </button>

    <p id="shopMessage">Собери 20 очков!</p>
</div>

<h2 id="record">Рекорд: 0</h2>
<p id="message">Начни игру!</p>

<script>
let score = 0;
let time = 0;
let playing = false;
let timer;

let power = Number(localStorage.getItem("hamzaPower")) || 1;
let record = Number(localStorage.getItem("hamzaRecord")) || 0;

document.getElementById("power").innerText = power;
document.getElementById("record").innerText = "Рекорд: " + record;

function startGame(seconds) {
    clearInterval(timer);

    score = 0;
    time = seconds;
    playing = true;

    document.getElementById("score").innerText = score;
    document.getElementById("timer").innerText = "Время: " + time;
    document.getElementById("message").innerText = "Быстрее нажимай!";
    document.getElementById("shopMessage").innerText =
        "Собери 20 очков для покупки!";
    
    timer = setInterval(function() {
        time--;

        document.getElementById("timer").innerText = "Время: " + time;

        if (time <= 0) {
            clearInterval(timer);
            playing = false;

            document.getElementById("message").innerText =
                "Игра окончена! Очки: " + score;

            if (score > record) {
                record = score;
                localStorage.setItem("hamzaRecord", record);

                document.getElementById("record").innerText =
                    "Рекорд: " + record;

                document.getElementById("message").innerText =
                    "НОВЫЙ РЕКОРД! 🏆";
            }
        }
    }, 1000);
}

function addPoint() {
    if (!playing) return;

    score += power;

    document.getElementById("score").innerText = score;
}

function buyUpgrade() {
    if (score < 20) {
        document.getElementById("shopMessage").innerText =
            "Недостаточно очков! У тебя: " + score;
        return;
    }

    score -= 20;
    power++;

    localStorage.setItem("hamzaPower", power);

    document.getElementById("score").innerText = score;
    document.getElementById("power").innerText = power;

    document.getElementById("shopMessage").innerText =
        "ПОКУПКА УДАЛАСЬ! Теперь клик даёт " + power + " очков!";
}
</script>

</body>
</html>
