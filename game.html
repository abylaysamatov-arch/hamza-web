
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZA GAME</title>

<style>
body {
    background: #172554;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 15px;
}

h1 {
    color: #60A5FA;
}

#score {
    font-size: 35px;
    margin: 20px;
}

button {
    background: #2563EB;
    color: white;
    border: none;
    padding: 16px 25px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: #1D4ED8;
}

#clickButton {
    background: #16A34A;
    font-size: 25px;
    padding: 25px 40px;
}

#clickButton:disabled {
    background: #64748B;
}
</style>
</head>

<body>

<h1>HAMZA GAME 🎮</h1>

<h2>Нажми на кнопку за 10 секунд!</h2>

<div id="score">Очки: 0</div>
<div id="timer">Время: 10</div>

<button onclick="startGame()">Начать игру</button>

<br>

<button id="clickButton" onclick="addPoint()" disabled>
НАЖМИ МЕНЯ!
</button>

<p id="result">Готов играть?</p>

<script>
let score = 0;
let time = 10;
let timer;
let playing = false;

function startGame() {
    clearInterval(timer);

    score = 0;
    time = 10;
    playing = true;

    document.getElementById("score").innerText = "Очки: 0";
    document.getElementById("timer").innerText = "Время: 10";
    document.getElementById("result").innerText = "Начали!";
    document.getElementById("clickButton").disabled = false;

    timer = setInterval(function() {
        time--;

        document.getElementById("timer").innerText =
            "Время: " + time;

        if (time <= 0) {
            clearInterval(timer);
            playing = false;

            document.getElementById("clickButton").disabled = true;
            document.getElementById("result").innerText =
                "Игра окончена! Твой результат: " + score;
        }
    }, 1000);
}

function addPoint() {
    if (playing) {
        score++;

        document.getElementById("score").innerText =
            "Очки: " + score;
    }
}
</script>

</body>
</html>
